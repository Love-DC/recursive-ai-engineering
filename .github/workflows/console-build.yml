name: Owner Console Build

on:
  push:
    paths:
      - "console/**"
      - ".github/workflows/console-build.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - name: Record push build result
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          BUILD_STATUS: ${{ job.status }}
        with:
          script: |
            const path = 'reports/console-build-status.md';
            const branch = context.ref.replace('refs/heads/', '');
            const body = [
              '# Owner Console Build',
              '',
              `Result: ${process.env.BUILD_STATUS}`,
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ''
            ].join('\\n');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ci: record owner console build ${process.env.BUILD_STATUS}`,
              content: Buffer.from(body).toString('base64'),
              branch,
              ...(sha ? { sha } : {})
            });
