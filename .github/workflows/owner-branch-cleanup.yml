name: Owner-controlled branch cleanup

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Branch names to inspect, one per line"
        required: true
        type: string
      confirmation:
        description: "Type DELETE MERGED BRANCHES to delete eligible branches; leave blank for preview"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: owner-branch-cleanup
  cancel-in-progress: false

jobs:
  preview:
    name: Preview branch cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preview requested branches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          printf '%s\n' "$BRANCHES" > "$RUNNER_TEMP/branches.txt"
          python scripts/cleanup_branches.py \
            --repository "$GITHUB_REPOSITORY" \
            --branches-file "$RUNNER_TEMP/branches.txt"

  delete:
    name: Delete confirmed eligible branches
    if: inputs.confirmation == 'DELETE MERGED BRANCHES'
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate and delete eligible branches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCHES: ${{ inputs.branches }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          printf '%s\n' "$BRANCHES" > "$RUNNER_TEMP/branches.txt"
          python scripts/cleanup_branches.py \
            --repository "$GITHUB_REPOSITORY" \
            --branches-file "$RUNNER_TEMP/branches.txt" \
            --execute \
            --confirmation "$CONFIRMATION"
