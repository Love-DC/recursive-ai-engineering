name: PostgreSQL task lifecycle integration

on:
  push:
    branches:
      - main
      - "rae/**"
      - "ai/**"
  pull_request:
    branches:
      - main
      - "ai/**"

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_OWNER_ID: 00000000-0000-4000-8000-000000000001
      SUPABASE_PROJECT_ID: 00000000-0000-4000-8000-000000000002
      SHARED_WORKER_ID: 00000000-0000-4000-8000-000000000003
      SECOND_WORKER_ID: 00000000-0000-4000-8000-000000000004
      REVIEWER_WORKER_ID: 00000000-0000-4000-8000-000000000005
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client and jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client jq

      - name: Validate migration version inventory and dependency order
        run: python3 scripts/test_migration_versions.py

      - name: Validate Worker-routing migration structure
        run: python3 scripts/test_worker_routing_migration_shape.py

      - name: Validate task-dependency migration structure
        run: python3 scripts/test_task_dependency_migration_shape.py

      - name: Prepare isolated Supabase-compatible PostgreSQL fixture
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, deleted_at timestamptz, created_at timestamptz DEFAULT now());
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          SQL
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/database-schema.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000100_worker_identity_isolation.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000200_worker_task_scope.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000300_failure_reporting_retry.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000400_worker_task_routing_safe_release.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261124000100_task_dependency_eligibility.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261124000200_ai_initiative_lifecycle.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES ('00000000-0000-4000-8000-000000000001');
          INSERT INTO public.projects(id,name,owner_id,status,config)
          VALUES (
            '00000000-0000-4000-8000-000000000002',
            'failure-recovery-test',
            '00000000-0000-4000-8000-000000000001',
            'active',
            '{"worker_routing":{"default_worker_key":["test-worker-a","test-worker-b"],"task_type_worker_keys":{"review":["test-reviewer"]}}}'::jsonb
          );
          INSERT INTO public.workers(id,project_id,worker_key,display_name,status,auth_user_id)
          VALUES
            ('00000000-0000-4000-8000-000000000003','00000000-0000-4000-8000-000000000002','test-worker-a','Test Worker A','active','00000000-0000-4000-8000-000000000001'),
            ('00000000-0000-4000-8000-000000000004','00000000-0000-4000-8000-000000000002','test-worker-b','Test Worker B','active',NULL),
            ('00000000-0000-4000-8000-000000000005','00000000-0000-4000-8000-000000000002','test-reviewer','Test Reviewer','active',NULL);
          SQL

      - name: Run Worker route isolation and fenced release integration tests
        env:
          SUPABASE_OWNER_ID: 00000000-0000-4000-8000-000000000001
          SUPABASE_PROJECT_ID: 00000000-0000-4000-8000-000000000002
          SHARED_WORKER_ID: 00000000-0000-4000-8000-000000000003
          SECOND_WORKER_ID: 00000000-0000-4000-8000-000000000004
          REVIEWER_WORKER_ID: 00000000-0000-4000-8000-000000000005
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v owner_id="$SUPABASE_OWNER_ID" -v project_id="$SUPABASE_PROJECT_ID" -v worker_a="$SHARED_WORKER_ID" -v worker_b="$SECOND_WORKER_ID" -v reviewer_worker="$REVIEWER_WORKER_ID" -f tests/worker-routing-release-tests.sql

      - name: Run task dependency eligibility integration tests
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v owner_id="$SUPABASE_OWNER_ID" -v project_id="$SUPABASE_PROJECT_ID" -v worker_id="$SHARED_WORKER_ID" -f tests/task-dependency-eligibility-tests.sql

      - name: Run AI Initiative lifecycle acceptance tests
        run: bash scripts/test-ai-initiative-lifecycle.sh

      - name: Run Initiative support/advance concurrency regression
        run: bash scripts/test-initiative-support-advance-race.sh

      - name: Run failure reporting and bounded retry integration tests
        env:
          FAILURE_RECOVERY_TEST_ALLOW_MUTATIONS: "YES"
        run: bash scripts/test-failure-recovery.sh

      - name: Run two-session fail versus lease-reclaim race
        run: bash scripts/test-fail-reclaim-race.sh

      - name: Run task lifecycle integration harness
        env:
          TASK_LIFECYCLE_TEST_ALLOW_MUTATIONS: "YES"
        run: bash scripts/test-task-lifecycle.sh

      - name: Run two-session atomic claim race
        run: bash scripts/test-claim-concurrency.sh

      - name: Run two-session same-Worker atomic claim race
        run: bash scripts/test-same-worker-concurrency.sh
