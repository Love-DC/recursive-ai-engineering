name: Repository governance protocol tests

on:
  pull_request:
    branches: [main]
    paths:
      - "rae-governance.json"
      - "scripts/repository_governance.py"
      - "tests/test_repository_governance.py"
      - "docs/REPOSITORY-GOVERNANCE-PROTOCOL.md"
      - ".github/workflows/repository-governance.yml"
  push:
    branches: [main]
    paths:
      - "rae-governance.json"
      - "scripts/repository_governance.py"
      - "tests/test_repository_governance.py"
      - "docs/REPOSITORY-GOVERNANCE-PROTOCOL.md"
      - ".github/workflows/repository-governance.yml"

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate RAE governance manifest against repository
        run: |
          SHA="$(git rev-parse HEAD)"
          python scripts/repository_governance.py . --expected-sha "$SHA" --actual-sha "$SHA"
      - name: Run governance discovery tests
        run: python -m unittest discover -s tests -p "test_repository_governance.py" -v
      - name: Compile governance adapter
        run: python -m py_compile scripts/repository_governance.py tests/test_repository_governance.py
