name: Shell static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n scripts/test-claim-concurrency.sh
          bash -n scripts/test-task-lifecycle.sh
          bash -n scripts/test-failure-recovery.sh
          bash -n scripts/test-fail-reclaim-race.sh

      - name: Run resource inventory and cleanup unit tests
        run: |
          python -m py_compile scripts/resource_inventory.py scripts/cleanup_branches.py
          python -m unittest scripts.test_resource_inventory scripts.test_cleanup_branches -v

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning scripts/test-claim-concurrency.sh scripts/test-task-lifecycle.sh scripts/test-failure-recovery.sh scripts/test-fail-reclaim-race.sh
